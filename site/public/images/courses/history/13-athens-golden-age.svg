<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
<title id="t">雅典变漂亮了</title><desc id="d">从战后重建到神庙、戏剧与不同人的生活。</desc>
<rect width="1200" height="675" fill="#f2e6cf"/><rect width="1200" height="22" fill="#793e32"/>
<text x="72" y="108" font-family="sans-serif" font-weight="700" font-size="42" fill="#633c32">雅典变漂亮了</text><text x="74" y="158" font-family="sans-serif" font-size="24" fill="#765c4d">神庙、戏剧和雕像背后，是谁在出钱出力？</text><text x="1040" y="110" font-family="serif" font-size="60" fill="#a6674d">13</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="65" y="240" width="305" height="200" rx="18" fill="#8e5140"/><rect x="447" y="240" width="305" height="200" rx="18" fill="#ab704e"/><rect x="830" y="240" width="305" height="200" rx="18" fill="#705047"/>
<g fill="#fff5e4"><text x="217" y="305" font-size="28">战争以后</text><text x="217" y="360" font-size="21">重建城市</text><text x="217" y="395" font-size="21">同盟、港口与战船</text><text x="599" y="305" font-size="28">雅典繁荣</text><text x="599" y="360" font-size="21">神庙、戏剧与雕像</text><text x="599" y="395" font-size="21">更多公民参与决定</text><text x="982" y="305" font-size="28">再问一问</text><text x="982" y="360" font-size="21">谁出钱？谁劳动？</text><text x="982" y="395" font-size="21">谁不能投票？</text></g><g fill="#8e5140" font-size="40"><text x="408" y="352">›</text><text x="791" y="352">›</text></g></g>
<text x="75" y="540" font-family="sans-serif" font-size="22" fill="#765c4d">一座城市的故事，要看得见神庙，也看得见建造它的人。</text></svg>
