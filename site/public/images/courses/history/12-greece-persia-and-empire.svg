<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">希腊与波斯：从冲突到帝国</title><desc id="desc">帝国边疆冲突、银矿舰队、共同抵抗、雅典支配盟友的四阶段因果图。</desc>
<rect width="1200" height="675" fill="#f2e6cf"/><rect width="1200" height="22" fill="#793e32"/>
<text x="72" y="110" font-family="sans-serif" font-size="42" font-weight="700" fill="#633c32">当帝国撞上城邦</text><text x="75" y="158" font-family="sans-serif" font-size="23" fill="#765c4d">战争如何改变雅典与爱琴海的权力</text><text x="1032" y="113" font-family="serif" font-size="62" fill="#a6674d">12</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="60" y="235" width="240" height="220" rx="18" fill="#8e5140"/><rect x="340" y="235" width="240" height="220" rx="18" fill="#a96d4d"/><rect x="620" y="235" width="240" height="220" rx="18" fill="#bd8559"/><rect x="900" y="235" width="240" height="220" rx="18" fill="#705047"/>
<g fill="#fff5e4"><text x="180" y="303" font-size="28">帝国边疆</text><text x="180" y="360" font-size="21">伊奥尼亚起义</text><text x="180" y="395" font-size="21">冲突跨越爱琴海</text><text x="460" y="303" font-size="28">银矿与舰队</text><text x="460" y="360" font-size="21">资源、劳动</text><text x="460" y="395" font-size="21">转化为海上力量</text><text x="740" y="303" font-size="28">共同抵抗</text><text x="740" y="360" font-size="21">萨拉米斯</text><text x="740" y="395" font-size="21">普拉提亚</text><text x="1020" y="303" font-size="28">同盟与帝国</text><text x="1020" y="360" font-size="21">舰队与资金集中</text><text x="1020" y="395" font-size="21">盟友越来越难退出</text></g>
<g fill="#8e5140" font-size="36"><text x="320" y="355">›</text><text x="600" y="355">›</text><text x="880" y="355">›</text></g></g><text x="75" y="550" font-family="sans-serif" font-size="22" fill="#765c4d">一场战争既改变公民的政治位置，也改变城邦之间的权力关系。</text></svg>
