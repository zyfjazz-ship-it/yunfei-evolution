<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">亚历山大走后，文化继续相遇</title><desc id="desc">从征服与迁徙到港口城市，再到不同传统的交流。</desc><rect width="1200" height="675" fill="#f2e6cf"/><rect width="1200" height="22" fill="#793e32"/><text x="72" y="106" font-family="sans-serif" font-size="42" font-weight="700" fill="#633c32">亚历山大走后，文化继续相遇</text><text x="75" y="158" font-family="sans-serif" font-size="24" fill="#765c4d">从希腊到埃及、波斯和更远的地方</text><text x="1042" y="222" font-family="serif" font-size="50" fill="#a6674d">15</text><g font-family="sans-serif" text-anchor="middle"><rect x="60" y="254" width="320" height="205" rx="18" fill="#8e5140"/><rect x="440" y="254" width="320" height="205" rx="18" fill="#aa7050"/><rect x="820" y="254" width="320" height="205" rx="18" fill="#705047"/><g fill="#fff5e4"><text x="220" y="320" font-size="30">战争与迁徙</text><text x="220" y="373" font-size="21">帝国扩张，也有人失去家园</text><text x="600" y="320" font-size="30">港口与城市</text><text x="600" y="373" font-size="21">商人、工匠和学者相遇</text><text x="980" y="320" font-size="30">文化继续变化</text><text x="980" y="373" font-size="21">神庙、雕像和信仰交流</text></g><g fill="#8e5140" font-size="42"><text x="410" y="365">›</text><text x="790" y="365">›</text></g></g><text x="75" y="552" font-family="sans-serif" font-size="22" fill="#765c4d">帝国可以分开，人与文化的故事仍在继续。</text></svg>
