<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">自由与秩序：人该怎样生活</title><desc id="desc">苏格拉底的追问、孔子的人际关系与庄子对固定标准的反思。</desc><rect width="1200" height="675" fill="#f3e8d4"/><rect width="1200" height="20" fill="#793e32"/><text x="72" y="110" font-family="sans-serif" font-size="40" font-weight="700" fill="#633c32">人该怎样自由，又怎样和别人一起生活？</text><text x="75" y="160" font-family="sans-serif" font-size="24" fill="#765c4d">从雅典到中国：不同的人，提出不同的问题</text><text x="1045" y="222" font-family="serif" font-size="50" fill="#a6674d">14</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="255" width="310" height="210" rx="18" fill="#8e5140"/><rect x="445" y="255" width="310" height="210" rx="18" fill="#ad7452"/><rect x="820" y="255" width="310" height="210" rx="18" fill="#705047"/><g fill="#fff5e4"><text x="225" y="325" font-size="30">苏格拉底</text><text x="225" y="382" font-size="23">我能不能追问？</text><text x="600" y="325" font-size="30">孔子</text><text x="600" y="382" font-size="23">怎样和别人相处？</text><text x="975" y="325" font-size="30">老子与庄子</text><text x="975" y="382" font-size="23">标准只有一种吗？</text></g></g><text x="75" y="555" font-family="sans-serif" font-size="22" fill="#765c4d">看见不同的答案，也看见它们留下的问题。</text></svg>
