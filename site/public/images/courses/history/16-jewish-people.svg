<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">犹太人的故事：家园、流散与信仰</title><desc id="desc">从家园和王国到流亡重建，再到经典与信仰的传播。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#3d1d1c"/><stop offset="1" stop-color="#8b4d39"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="72" y="99" fill="#efd8b9" font-size="28" font-family="sans-serif">文明与历史</text><text x="72" y="166" fill="#fff5e7" font-size="43" font-family="sans-serif">犹太人的故事</text><text x="72" y="215" fill="#ead0b5" font-size="24" font-family="sans-serif">从寻找家园，到把信仰带向世界</text><text x="1040" y="120" fill="#e0ad80" font-size="76" font-family="Georgia">16</text><g font-family="sans-serif" text-anchor="middle"><rect x="65" y="320" width="290" height="160" rx="18" fill="#f3dfc6"/><text x="210" y="383" fill="#4a2924" font-size="29">家园与王国</text><text x="210" y="426" fill="#704c40" font-size="20">祖先的故事 · 圣殿</text><text x="385" y="410" fill="#f1d2ae" font-size="40">→</text><rect x="455" y="320" width="290" height="160" rx="18" fill="#dcae86"/><text x="600" y="383" fill="#4a2924" font-size="29">征服与流散</text><text x="600" y="426" fill="#704c40" font-size="20">失国 · 异乡 · 回归</text><text x="775" y="410" fill="#f1d2ae" font-size="40">→</text><rect x="845" y="320" width="290" height="160" rx="18" fill="#f3dfc6"/><text x="990" y="383" fill="#4a2924" font-size="29">信仰与传播</text><text x="990" y="426" fill="#704c40" font-size="20">经典 · 社群 · 交流</text></g><text x="72" y="585" fill="#ead0b5" font-size="22" font-family="sans-serif">在动荡中，人与故事怎样继续走下去？</text></svg>
