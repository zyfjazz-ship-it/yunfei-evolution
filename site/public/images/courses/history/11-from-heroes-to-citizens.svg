<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从英雄到公民</title>
  <desc id="desc">从倒塌的宫殿，经由航海、重装步兵和债务危机，走向公民大会的连续因果图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#321915"/>
      <stop offset="1" stop-color="#8f4630"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#769a9b"/>
      <stop offset="1" stop-color="#315f64"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#160b09" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e8b66c"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="34" fill="url(#background)"/>
  <circle cx="1070" cy="96" r="190" fill="#f2dfd6" opacity=".07"/>
  <circle cx="80" cy="650" r="250" fill="#e8b66c" opacity=".06"/>

  <text x="72" y="74" fill="#e8b66c" font-family="system-ui, sans-serif" font-size="20" font-weight="750" letter-spacing="5">文明与历史</text>
  <text x="72" y="144" fill="#fff7ef" font-family="system-ui, sans-serif" font-size="56" font-weight="760">从英雄到公民</text>
  <text x="72" y="184" fill="#e7cbc0" font-family="system-ui, sans-serif" font-size="24">城邦与雅典民主不是突然被发明出来的</text>
  <text x="1080" y="145" fill="#f2dfd6" opacity=".7" text-anchor="middle" font-family="Georgia, serif" font-size="110">11</text>

  <g filter="url(#shadow)">
    <rect x="62" y="252" width="245" height="300" rx="22" fill="#f5e8d6"/>
    <rect x="332" y="252" width="245" height="300" rx="22" fill="#d9e1dc"/>
    <rect x="602" y="252" width="245" height="300" rx="22" fill="#efd3b2"/>
    <rect x="872" y="252" width="266" height="300" rx="22" fill="#f5e8d6"/>
  </g>

  <path d="M307 400 H329 M577 400 H599 M847 400 H869" stroke="#e8b66c" stroke-width="8" marker-end="url(#arrow)"/>

  <g transform="translate(92 292)" fill="none" stroke="#7f3e2f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 77 L94 23 L172 77"/>
    <path d="M35 77 V155 M75 77 V155 M115 77 V155 M155 77 V155"/>
    <path d="M18 155 H174"/>
    <path d="M84 18 L101 47 L87 68 L105 94" stroke="#c65f3e"/>
    <path d="M135 155 L166 132" stroke="#c65f3e"/>
  </g>
  <text x="184" y="493" text-anchor="middle" fill="#6e3429" font-family="system-ui, sans-serif" font-size="24" font-weight="760">宫殿崩溃</text>
  <text x="184" y="524" text-anchor="middle" fill="#956455" font-family="system-ui, sans-serif" font-size="17">旧中心消失</text>

  <g transform="translate(356 286)">
    <path d="M5 123 Q105 170 197 123 Q183 181 99 185 Q31 181 5 123Z" fill="url(#sea)"/>
    <path d="M96 22 V123 M96 30 L169 92 H96Z" fill="#f6ead8" stroke="#315f64" stroke-width="7" stroke-linejoin="round"/>
    <path d="M41 107 H168" stroke="#315f64" stroke-width="9" stroke-linecap="round"/>
    <circle cx="180" cy="45" r="33" fill="#bd6a42" stroke="#f6ead8" stroke-width="8"/>
    <circle cx="180" cy="45" r="9" fill="#f6ead8"/>
  </g>
  <text x="454" y="493" text-anchor="middle" fill="#315f64" font-family="system-ui, sans-serif" font-size="24" font-weight="760">贸易与军役</text>
  <text x="454" y="524" text-anchor="middle" fill="#5e7475" font-family="system-ui, sans-serif" font-size="17">财富和义务扩大</text>

  <g transform="translate(633 290)">
    <path d="M28 40 H159 L176 182 H11Z" fill="#f7e6cf" stroke="#9a4b31" stroke-width="8" stroke-linejoin="round"/>
    <path d="M58 40 V14 H129 V40" fill="none" stroke="#9a4b31" stroke-width="8"/>
    <path d="M44 82 H142 M40 119 H147 M36 155 H153" stroke="#d08a55" stroke-width="7"/>
    <circle cx="188" cy="57" r="24" fill="#9a4b31"/>
    <path d="M188 47 V66 M178 57 H198" stroke="#f7e6cf" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="724" y="493" text-anchor="middle" fill="#7f3e2f" font-family="system-ui, sans-serif" font-size="24" font-weight="760">债务危机</text>
  <text x="724" y="524" text-anchor="middle" fill="#a66a4d" font-family="system-ui, sans-serif" font-size="17">自由公民被吞噬</text>

  <g transform="translate(906 283)" fill="none" stroke="#7f3e2f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 88 L104 28 L190 88"/>
    <path d="M38 88 V151 M78 88 V151 M118 88 V151 M158 88 V151"/>
    <path d="M20 151 H188"/>
    <circle cx="49" cy="187" r="17" fill="#bd6a42" stroke="none"/>
    <circle cx="104" cy="187" r="17" fill="#315f64" stroke="none"/>
    <circle cx="159" cy="187" r="17" fill="#bd6a42" stroke="none"/>
    <path d="M49 204 V224 M104 204 V224 M159 204 V224"/>
  </g>
  <text x="1005" y="493" text-anchor="middle" fill="#6e3429" font-family="system-ui, sans-serif" font-size="24" font-weight="760">公民共同体</text>
  <text x="1005" y="524" text-anchor="middle" fill="#956455" font-family="system-ui, sans-serif" font-size="17">身份与权力重组</text>

  <text x="600" y="620" text-anchor="middle" fill="#f0d9cd" font-family="system-ui, sans-serif" font-size="19" letter-spacing="2">地理 · 土地 · 贸易 · 战争 · 法律 · 艺术</text>
</svg>
