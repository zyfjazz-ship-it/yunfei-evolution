<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">短期起伏与长期债务积累</title><desc id="desc">短期借贷与经济活动可能上下起伏。长期而言，如果债务持续增长快于收入，债务负担可能累积。图中线条只是概念示意，没有数据或固定周期。</desc><rect width="1200" height="730" rx="24" fill="#f1e5d0"/><g font-family="system-ui, sans-serif"><text x="65" y="78" fill="#183d3e" font-size="42" font-weight="700">短期有起伏，长期看负担</text><text x="65" y="122" fill="#426762" font-size="25">经济一轮轮变化，债务与收入的关系也会变化</text>
<rect x="65" y="160" width="1070" height="480" rx="22" fill="#fffaf0"/><text x="100" y="212" fill="#183d3e" font-size="29" font-weight="700">一轮一轮的短期起伏</text><path d="M100 365H1100" stroke="#d8d6c8" stroke-width="3"/><path d="M105 335 C165 300 205 265 255 278 S340 365 395 340 S480 245 540 265 S625 358 680 330 S760 245 820 270 S900 353 960 320 S1040 262 1095 285" stroke="#477f76" stroke-width="9" fill="none" stroke-linecap="round"/><text x="100" y="409" fill="#52736d" font-size="23">借贷、支出和收入可能反复上升、放缓</text>
<path d="M100 440H1100" stroke="#e6decf" stroke-width="3"/><text x="100" y="491" fill="#183d3e" font-size="29" font-weight="700">长期还要问：债务相对收入，是否越来越重？</text><text x="100" y="544" fill="#426762" font-size="25">如果债务长期增长快于收入，偿还压力可能逐渐累积。</text><text x="100" y="589" fill="#845b37" font-size="23">债务未必每轮都增加，生产力、收入与政策也会影响结果。</text></g><text x="65" y="690" fill="#59736d" font-family="system-ui, sans-serif" font-size="22">概念示意，非实际数据或预测；周期长度并不固定。</text></svg>
