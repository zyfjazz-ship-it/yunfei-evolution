<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">信用扩张与收缩</title><desc id="desc">信贷扩张可能带来更多支出、订单与收入；债务压力上升时，借款与支出减少可能影响订单与收入，使偿债更难。两条链是可能发生的反馈，不是必然规律。</desc>
<rect width="1200" height="760" rx="24" fill="#102f34"/><g font-family="system-ui, sans-serif"><text x="65" y="85" font-size="42" font-weight="700" fill="#f2f7f4">借钱能推动繁荣，也可能放大收缩</text><text x="65" y="132" font-size="25" fill="#b8d2ce">同一条链，可能朝两个方向转动</text>
<rect x="55" y="180" width="1090" height="220" rx="22" fill="#245d59"/><text x="88" y="230" fill="#c8e9df" font-size="29" font-weight="700">信用扩张时</text><g fill="#f2f7f4" font-size="27" text-anchor="middle"><text x="190" y="307">借钱增加</text><text x="455" y="307">支出增加</text><text x="735" y="307">订单和收入改善</text><text x="1014" y="307">更愿意借贷</text></g><g stroke="#efb96f" stroke-width="5" fill="none"><path d="M275 298h75m-12-10 12 10-12 10M540 298h63m-12-10 12 10-12 10M865 298h45m-12-10 12 10-12 10"/></g><text x="89" y="365" fill="#c8e9df" font-size="22">收入增加，可能让借款与消费进一步增加。</text>
<rect x="55" y="430" width="1090" height="220" rx="22" fill="#f2e3c8"/><text x="88" y="480" fill="#7a502f" font-size="29" font-weight="700">债务压力加重时</text><g fill="#173f40" font-size="27" text-anchor="middle"><text x="190" y="557">债务压力</text><text x="455" y="557">支出减少</text><text x="735" y="557">订单和收入下降</text><text x="1014" y="557">还债更难</text></g><g stroke="#bc7d40" stroke-width="5" fill="none"><path d="M275 548h75m-12-10 12 10-12 10M540 548h63m-12-10 12 10-12 10M865 548h45m-12-10 12 10-12 10"/></g><text x="89" y="615" fill="#6c5b46" font-size="22">收入下降，可能进一步压低消费和投资。</text>
<text x="65" y="712" fill="#b8d2ce" font-size="23">这是可能发生的反馈，具体结果还取决于收入、政策和其他条件。</text></g></svg>
