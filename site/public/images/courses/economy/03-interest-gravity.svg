<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">利率是资本世界的重力</title><desc id="desc">利率升高时，遥远的未来现金流折现后价值下降。</desc>
  <rect width="1200" height="675" fill="#183d42"/><text x="80" y="105" font-family="system-ui" font-size="42" font-weight="800" fill="#eef6f2">利率：资本世界的“重力”</text>
  <line x1="120" y1="540" x2="1080" y2="540" stroke="#9ecfc3" stroke-width="4"/><line x1="120" y1="540" x2="120" y2="160" stroke="#9ecfc3" stroke-width="4"/>
  <path d="M150 220 C410 250 700 345 1035 505" fill="none" stroke="#f0bd75" stroke-width="14" stroke-linecap="round"/><path d="M150 300 C430 340 730 440 1035 525" fill="none" stroke="#79b9ad" stroke-width="8" stroke-linecap="round"/>
  <g font-family="system-ui"><text x="155" y="195" font-size="26" fill="#f0bd75">低利率：未来更值钱</text><text x="155" y="345" font-size="26" fill="#9ed4c8">高利率：未来被更重地折现</text><text x="955" y="590" font-size="24" fill="#9ed4c8">时间 →</text><text x="50" y="190" font-size="24" fill="#9ed4c8" transform="rotate(-90 50 190)">现值</text></g>
</svg>
