<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">银行放贷同时创造存款</title><desc id="desc">贷款与存款在银行资产负债表两端同时出现。</desc>
  <rect width="1200" height="675" fill="#e8f0ec"/><text x="80" y="100" font-family="system-ui" font-size="42" font-weight="800" fill="#173f43">银行到底怎样创造钱？</text>
  <rect x="390" y="165" width="420" height="365" rx="30" fill="#173f43"/><path d="M440 255h320M440 330h320M440 405h320" stroke="#7fb7ab" stroke-width="5"/><text x="600" y="225" text-anchor="middle" font-family="system-ui" font-size="36" font-weight="800" fill="#fff">商业银行</text>
  <g font-family="system-ui" font-weight="800"><rect x="65" y="250" width="230" height="165" rx="24" fill="#c98c51"/><text x="180" y="325" text-anchor="middle" font-size="34" fill="#fff">贷款</text><text x="180" y="365" text-anchor="middle" font-size="20" fill="#fff2df">银行的资产</text><rect x="905" y="250" width="230" height="165" rx="24" fill="#477f76"/><text x="1020" y="325" text-anchor="middle" font-size="34" fill="#fff">存款</text><text x="1020" y="365" text-anchor="middle" font-size="20" fill="#d8eee9">银行的负债</text></g>
  <g stroke="#285f63" stroke-width="10" fill="#285f63"><path d="M295 335h75"/><path d="M355 315l25 20-25 20"/><path d="M810 335h75"/><path d="M870 315l25 20-25 20"/></g><text x="600" y="590" text-anchor="middle" font-family="system-ui" font-size="28" fill="#285f63">同一笔放贷，在账本两端同时出现</text>
</svg>
