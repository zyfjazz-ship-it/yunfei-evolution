<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">资产负债表衰退</title><desc id="desc">资产下跌，债务仍在，支出收缩影响收入和需求。</desc><defs><linearGradient id="bg"><stop stop-color="#102f34"/><stop offset="1" stop-color="#285f63"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><g font-family="system-ui, sans-serif" fill="#f2f7f4"><text x="80" y="105" font-size="44">资产下跌，为什么不敢花钱？</text><text x="80" y="158" font-size="24" fill="#b8d2ce">从家庭账本到整个经济的需求</text><text x="1050" y="105" font-size="72" font-family="Georgia, serif">11</text><rect x="80" y="260" width="280" height="170" rx="24" fill="#f2e3c8"/><text x="120" y="330" font-size="30" fill="#102f34">资产价值下降</text><text x="120" y="380" font-size="24" fill="#285f63">债务仍须偿还</text><path d="M380 345h75" stroke="#efb96f" stroke-width="8"/><path d="M445 330l20 15-20 15" fill="none" stroke="#efb96f" stroke-width="8"/><rect x="480" y="260" width="280" height="170" rx="24" fill="#477f76"/><text x="520" y="330" font-size="30">缩减消费投资</text><text x="520" y="380" font-size="24">优先修复账本</text><path d="M780 345h75" stroke="#efb96f" stroke-width="8"/><path d="M845 330l20 15-20 15" fill="none" stroke="#efb96f" stroke-width="8"/><rect x="880" y="260" width="250" height="170" rx="24" fill="#c98c51"/><text x="910" y="330" font-size="30">需求变弱</text><text x="910" y="380" font-size="24">收入受到影响</text></g></svg>
